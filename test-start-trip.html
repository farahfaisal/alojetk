<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار بدء الرحلة - السائق</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #34495e;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            direction: rtl;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #ecf0f1;
            color: #34495e;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #bdc3c7;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.6;
        }

        .orders-list {
            max-height: 300px;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
        }

        .order-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .order-item:hover {
            background: #e9ecef;
            border-color: #667eea;
        }

        .order-item.selected {
            background: #e7eaf6;
            border-color: #667eea;
        }

        .order-number {
            font-weight: bold;
            color: #2c3e50;
            font-size: 16px;
        }

        .order-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 5px;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-processing { background: #cfe2ff; color: #084298; }
        .status-ready { background: #d1e7dd; color: #0f5132; }
        .status-shipping { background: #ffc107; color: #000; }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚚 بدء رحلة التوصيل</h1>
        <p class="subtitle">نظام اختبار بدء الرحلة للسائقين</p>

        <div class="info">
            <strong>📋 تعليمات الاستخدام:</strong><br>
            1. أدخل معرف السائق واسمه<br>
            2. اختر طلب من القائمة أو أدخل معرف الطلب يدويًا<br>
            3. اضغط "بدء الرحلة" لتحويل الطلب إلى "في الطريق"
        </div>

        <div class="section">
            <label>🔑 معرف السائق (UUID)</label>
            <input type="text" id="driverId" placeholder="مثال: 123e4567-e89b-12d3-a456-426614174000">
        </div>

        <div class="section">
            <label>👤 اسم السائق</label>
            <input type="text" id="driverName" placeholder="مثال: محمد أحمد" value="محمد السائق">
        </div>

        <div class="section">
            <label>📦 معرف الطلب (UUID)</label>
            <input type="text" id="orderId" placeholder="اختر من القائمة أو أدخل يدويًا">
        </div>

        <div class="section">
            <button onclick="loadOrders()" class="btn-secondary" id="loadBtn">
                📋 تحميل الطلبات المتاحة
            </button>
            <div id="ordersList" class="orders-list" style="display: none;"></div>
        </div>

        <div class="btn-group">
            <button onclick="startSingleTrip()" class="btn-primary" id="startBtn">
                🚀 بدء الرحلة
            </button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script type="module">
        const SUPABASE_URL = 'https://fliwyntfvfedslbwkvks.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsaXd5bnRmdmZlZHNsYndrdmtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3NjYxOTUsImV4cCI6MjA3NjM0MjE5NX0.Fxhqj4VMq_a1ZkHabPChkzTh4Ep_QqBqPS2LDq0dfLY';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const statusMap = {
            'pending': 'في انتظار الموافقة',
            'processing': 'جاري التحضير',
            'ready': 'جاهز للتوصيل',
            'shipping': 'في الطريق',
            'delivered': 'تم التوصيل',
            'completed': 'مكتمل'
        };

        window.loadOrders = async function() {
            const loadBtn = document.getElementById('loadBtn');
            const ordersList = document.getElementById('ordersList');
            const resultDiv = document.getElementById('result');

            loadBtn.disabled = true;
            loadBtn.innerHTML = '<div class="loader"></div> جاري التحميل...';
            resultDiv.style.display = 'none';

            try {
                // جلب الطلبات التي يمكن بدء رحلة لها
                const { data: orders, error } = await supabase
                    .from('orders')
                    .select('id, order_number, status, customer_name, total')
                    .in('status', ['pending', 'processing', 'ready', 'delivering'])
                    .order('created_at', { ascending: false })
                    .limit(20);

                if (error) throw error;

                if (orders.length === 0) {
                    ordersList.innerHTML = '<p style="text-align: center; color: #7f8c8d;">لا توجد طلبات متاحة للتوصيل</p>';
                } else {
                    ordersList.innerHTML = orders.map(order => `
                        <div class="order-item" onclick="selectOrder('${order.id}', '${order.order_number}')">
                            <div class="order-number">📦 طلب #${order.order_number}</div>
                            <div style="font-size: 14px; color: #7f8c8d; margin-top: 5px;">
                                ${order.customer_name || 'عميل'} • ${order.total} ريال
                            </div>
                            <span class="order-status status-${order.status}">
                                ${statusMap[order.status] || order.status}
                            </span>
                        </div>
                    `).join('');
                }

                ordersList.style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>❌ خطأ!</strong><br>${error.message}`;
                resultDiv.style.display = 'block';
            } finally {
                loadBtn.disabled = false;
                loadBtn.innerHTML = '📋 تحميل الطلبات المتاحة';
            }
        };

        window.selectOrder = function(orderId, orderNumber) {
            document.getElementById('orderId').value = orderId;

            // تحديد العنصر المختار
            document.querySelectorAll('.order-item').forEach(item => {
                item.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
        };

        window.startSingleTrip = async function() {
            const driverId = document.getElementById('driverId').value.trim();
            const driverName = document.getElementById('driverName').value.trim();
            const orderId = document.getElementById('orderId').value.trim();
            const startBtn = document.getElementById('startBtn');
            const resultDiv = document.getElementById('result');

            // التحقق من المدخلات
            if (!driverId || !orderId) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '<strong>⚠️ تنبيه!</strong><br>يرجى إدخال معرف السائق ومعرف الطلب';
                resultDiv.style.display = 'block';
                return;
            }

            startBtn.disabled = true;
            startBtn.innerHTML = '<div class="loader"></div> جاري بدء الرحلة...';
            resultDiv.style.display = 'none';

            try {
                const { data, error } = await supabase.rpc('start_delivery_trip', {
                    p_order_id: orderId,
                    p_driver_id: driverId,
                    p_driver_name: driverName || null
                });

                if (error) throw error;

                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ تم بدء الرحلة بنجاح!</strong><br>
                        <p style="margin-top: 10px;">
                            📦 الطلب: ${data.order_id}<br>
                            🚚 الحالة الجديدة: <strong>${statusMap[data.new_status] || data.new_status}</strong><br>
                            💬 ${data.message}
                        </p>
                    `;

                    // إعادة تحميل القائمة
                    setTimeout(() => loadOrders(), 1000);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>⚠️ لا يمكن بدء الرحلة</strong><br>
                        <p>${data.message}</p>
                        <p style="margin-top: 10px; font-size: 13px;">
                            الحالة الحالية: <strong>${statusMap[data.current_status] || data.current_status}</strong>
                        </p>
                    `;
                }

                resultDiv.style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <strong>❌ حدث خطأ!</strong><br>
                    <p>${error.message}</p>
                `;
                resultDiv.style.display = 'block';
            } finally {
                startBtn.disabled = false;
                startBtn.innerHTML = '🚀 بدء الرحلة';
            }
        };

        // تحميل تلقائي للطلبات عند فتح الصفحة
        window.addEventListener('load', () => {
            loadOrders();
        });
    </script>
</body>
</html>
