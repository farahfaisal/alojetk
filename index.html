        overflow-x: hidden;

      /* Fix for iOS Safari viewport issues */
      @supports (-webkit-touch-callout: none) {
        body {
          min-height: -webkit-fill-available;
          position: relative;
        }
        
        #root {
          min-height: -webkit-fill-available;
        }
      }
      
      /* Prevent horizontal scrolling and bouncing */
      html {
        overflow-x: hidden;
        width: 100vw;
        -webkit-text-size-adjust: 100%;
      }
      
      /* Fix for Google Maps on iOS */
      .gm-style {
        font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
        position: relative !important;
        overflow: hidden !important;
      }
      
      .gm-style > div {
        transform: none !important;
        position: relative !important;
      }
      
      .gm-style img {
        max-width: none !important;
        height: auto !important;
      }
      
      /* Prevent elastic scrolling on iOS */
      body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      
      /* Fix for iPhone notch and safe areas */
      @media screen and (max-width: 430px) {
        body {
          padding-top: max(env(safe-area-inset-top), 0px);
          padding-bottom: max(env(safe-area-inset-bottom), 0px);
        }
        
        #root {
          padding-top: max(env(safe-area-inset-top), 0px);
          min-height: calc(100vh - max(env(safe-area-inset-top), 0px) - max(env(safe-area-inset-bottom), 0px));

      }
